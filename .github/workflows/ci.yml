name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          else
            pip install pytest
          fi
      - name: Run tests
        run: |
          set +e
          pytest -q
          code=$?
          set -e
          # exit 5 = no tests collected; the gate opens at T03, when the first test file exists.
          # shortcut: deleting every test file reopens the gate; the PR to main must review that diff.
          if [ "$code" -eq 5 ] && [ -z "$(git ls-files '*test_*.py')" ]; then
            echo "::warning::no test files yet"
            exit 0
          fi
          exit "$code"
