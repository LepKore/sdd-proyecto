[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crochet-tracker"
version = "0.1.0"
description = "Anotador de proyectos de crochet con guía en PDF"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["crochet_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
